name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The offline suite: no LLM call, no API key, no JDK, no Maven. That is why it
  # needs no secrets and costs nothing to run on every push. The e2e tests are
  # deselected by pytest.ini's addopts; the job below runs them.
  #
  # Windows is in the matrix to prove the offline suite itself runs clean there
  # — path handling, and `.resolve()` not being the identity (tests/
  # test_java_analyzer.py asserts against `analyzer.project_path` for exactly
  # that reason). Be precise about what this does NOT cover: the GBK codepage,
  # which is what makes `print("✓")` fatal on the developer's machine. A
  # windows-latest runner is English Windows, so that class of bug stays a
  # manual check. The Windows leg runs 3.12 only; the oldest supported Python
  # is already covered on ubuntu.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  # "End-to-end verified" was a claim the README made while only a human could
  # reproduce it. This closes the loop: the real pipeline (build → detect →
  # target → prompt → write → javac → report) runs against a real Maven project
  # with the LLM replaced by a recording stub — no API key, no secrets.
  #
  # This is the job Windows matters most for: the platform-specific code paths
  # live here and nowhere else — `mvn.cmd` behind `cmd /c`, the `;` classpath
  # separator (Windows) vs `:` (elsewhere), and `javac.exe` resolved through
  # JAVA_HOME.
  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Command-line -m overrides pytest.ini's `addopts = -m "not e2e"`.
      - name: Run end-to-end tests
        run: pytest -q -m e2e

  # An image nobody builds is exactly the kind of thing that rots quietly, so
  # this job exists to fail when the Dockerfile stops working. It builds the
  # runtime image, runs the offline suite inside the dev stage, then drives the
  # real CLI against a bundled demo — which is what proves JAVA_HOME and Maven
  # are wired up *inside* the image rather than only on the runner. No API key:
  # `analyze` never reaches the LLM.
  #
  # Ubuntu-only, and knowingly so: `windows-latest` cannot run Linux
  # containers, so this is the one place the Windows legs above cannot follow.
  # The e2e job stays native for that reason.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The agent writes into the mounted project, so the container user has to
      # match the runner's or those writes fail outright.
      - name: Build the runtime image
        run: |
          docker build \
            --build-arg UID=$(id -u) \
            --build-arg GID=$(id -g) \
            -t testgen-agent .

      - name: Run the offline suite inside the image
        run: |
          docker build --target test -t testgen-agent-test .
          docker run --rm testgen-agent-test

      - name: Analyze a bundled project through the CLI
        run: |
          docker run --rm \
            -v "$PWD/examples/demo-project:/work" \
            testgen-agent analyze /work

  # Every other job runs from the checkout, where the flat modules import
  # straight off the cwd. This is the only job that exercises the *installed*
  # package, which is why `pip install .` was able to ship a wheel containing
  # just `extractor/` for a long time with nothing ever going red.
  #
  # Ubuntu-only: the wheel is pure Python and platform-independent, and this job
  # leans on the POSIX venv layout (`bin/`) for its paths.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install it into a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install dist/*.whl

      # Run from RUNNER_TEMP rather than the checkout: from the repo root the
      # flat modules resolve off the cwd, and a broken wheel would still look
      # fine — which is exactly how the original breakage stayed hidden.
      - name: The console script runs
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/installed/bin/testgen-agent" --help

      - name: The wheel carries every prompt template
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/installed/bin/python" - <<'PY'
          from pathlib import Path

          import agent
          import prompt_manager

          manager = prompt_manager.PromptManager(
              Path(agent.__file__).parent / "prompts"
          )
          for name in ("generate_system", "generate_user",
                       "repair_system", "repair_user"):
              assert getattr(manager, name), f"template did not load: {name}"
          print("all four templates loaded from site-packages")
          PY
