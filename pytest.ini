[pytest]
testpaths = tests
# The modules under test sit flat at the repo root (see CLAUDE.md), so the
# repo root has to be importable the same way `python main.py` makes it.
# tests/conftest.py also inserts it, which keeps this working on older pytest.
pythonpath = .

markers =
    e2e: end-to-end pipeline test; needs a JDK and Maven and builds a real project

# The default run stays offline, deterministic and ~0.3s (see CLAUDE.md), so the
# end-to-end test — which shells out to Maven and javac — is deselected here.
# A command-line `-m e2e` overrides it (command-line options win over addopts),
# which is how CI's separate e2e job runs it.
addopts = -m "not e2e"
